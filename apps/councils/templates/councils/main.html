{% extends "core/base.html" %}
{% load static %}

{% block title %}{% if council %}{{ council.name }} — {% endif %}Local Spend Tracker{% endblock %}

{% block extra_head %}
<link
  rel="stylesheet"
  href="{% static 'core/vendor/leaflet/leaflet.css' %}"
/>
<style>
  html, body, #app { height: 100%; margin: 0; }
  .layout { display: flex; align-items: stretch; height: 100%; background: var(--color-bg); }
  .main-panel { flex: 1; min-width: 0; position: relative; }
  #map { height: 100%; width: 100%; }

  /* The "selected council" slot -- name, action, status badges -- lives at
     the top of the sidebar (see _council_sidebar.html), not floating over
     the map. A button centered on top of an arbitrary polygon has no fixed
     screen position and occludes the exact geometry it's about; anchoring
     it to the sidebar's own edge gives it a constant, learnable home and
     keeps the map a clean data surface. */
  #council-detail-slot {
    padding-bottom: var(--space-4);
    margin-bottom: var(--space-4);
    border-bottom: 1px solid var(--color-border-subtle);
  }
  /* Flow utility (Andy Bell / piccalil.li) instead of a uniform flex gap --
     contextual vertical rhythm via margin-top on adjacent siblings, so
     spacing can reflect grouping rather than being one fixed number.
     Heading + action read as a single "pick this" unit and stay tight by
     default; --flow-space overrides that per-child for the one gap that
     needs to be looser (heading to action, so the action doesn't read as
     glued to the title), leaving the rest of the scale untouched. */
  #council-detail-slot > * + * {
    margin-block-start: var(--flow-space, var(--space-3));
  }
  #council-route-heading {
    font-size: 1.1rem;
    margin: 0;
  }
  #status {
    --flow-space: var(--space-4);
    font-size: 0.85rem;
    color: var(--color-text-muted);
  }
  #status a:not(.spend-cta) { color: var(--color-link); font-weight: 600; }

  a.spend-cta {
    display: block;
    width: 100%;
    box-sizing: border-box;
    text-align: center;
    /* Rectangular, matching the sidebar's own radius, not a pill -- it
       should read as part of the slot's surface, not an object floating
       above it. No independent shadow for the same reason. */
    background: var(--color-cta);
    color: var(--color-cta-text);
    font-weight: 700;
    font-size: 0.95rem;
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-md);
    text-decoration: none;
    transition: background 150ms ease;
  }
  a.spend-cta:hover {
    /* Restated, not inherited -- theme.css's generic a:hover has higher
       specificity (element+pseudo beats a lone class) and would otherwise
       overwrite this with the blue link-hover color, putting light blue
       text on an orange button. */
    color: var(--color-cta-text);
    background: var(--color-cta-hover);
  }

  /* Selected boundary gets a persistent glow, not a hover-only one -- it
     needs to read as "this is the one you picked" the whole time its page
     is open. Kept deliberately quiet -- a hairline-weight stroke (see
     SELECTED_STYLE in map.js) plus a single soft glow layer, not the
     heavier double-glow bloom this used to carry; dense dashboards read
     better with a thin definite edge than a saturated halo. The base
     (non-animated) rule is the glow's resting state; the pulse is a few
     cycles of emphasis on arrival, not a permanent loop -- an infinite
     animation running alongside page content trips WCAG 2.2.2
     (pause/stop/hide), so it's capped at 4 iterations here and settles
     back to the static glow once done. 2s/cycle is also nowhere near SC
     2.3.1's 3-flashes-per-second threshold. prefers-reduced-motion skips
     the animation and goes straight to the static glow. */
  .leaflet-interactive.council-boundary--selected {
    filter: drop-shadow(0 0 3px rgba(0, 172, 230, 0.35));
  }
  @media (prefers-reduced-motion: no-preference) {
    .leaflet-interactive.council-boundary--selected {
      animation: council-pulse 2s ease-in-out 4;
    }
  }
  @keyframes council-pulse {
    0%, 100% {
      filter: drop-shadow(0 0 3px rgba(0, 172, 230, 0.35));
    }
    50% {
      filter: drop-shadow(0 0 5px rgba(0, 172, 230, 0.55));
    }
  }
  /* Dark card with a saturated border, not a solid-fill floating bubble --
     reads as "flagged" without competing with the CTA for the same
     saturated-color attention. Static in the sidebar slot now, not pinned
     to a map corner, so it never overlaps #nation-note -- map.js still
     keeps them mutually exclusive since only one is ever relevant at once.
     The heading is static markup (map.js only ever writes .badge-body),
     so map.js can keep using textContent for the copy itself. */
  #coverage-badge {
    display: none;
    width: 100%;
    box-sizing: border-box;
    background: var(--color-alarm-bg);
    border: 1px solid var(--color-alarm);
    color: var(--color-alarm-text);
    padding: var(--space-3);
    border-radius: var(--radius-md);
    font-size: 0.8rem;
  }
  #coverage-badge.visible { display: block; }

  /* Same card treatment as #coverage-badge, but orange -- explains absent
     data, not a problem with data that exists. */
  #nation-note {
    display: none;
    width: 100%;
    box-sizing: border-box;
    background: var(--color-info-bg);
    border: 1px solid var(--color-cta);
    color: var(--color-info-text);
    padding: var(--space-3);
    border-radius: var(--radius-md);
    font-size: 0.8rem;
  }
  #nation-note.visible { display: block; }

  .badge-heading {
    font-weight: 700;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: var(--space-1);
  }
  .badge-body { font-weight: 500; line-height: 1.4; }

  /* Default cursor -- clickable, but shouldn't invite the click. */
  .nation-boundary {
    cursor: default;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .council-sidebar {
    width: 20rem;
    flex: none;
    overflow-y: auto;
    padding: var(--space-5);
    box-sizing: border-box;
    background: var(--color-surface);
    border-right: 1px solid var(--color-border-subtle);
  }
  #council-search {
    width: 100%;
    background: var(--color-bg-elevated);
    color: var(--color-text);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-3);
    font-family: var(--font-sans);
    font-size: 1rem;
    box-sizing: border-box;
  }
  #search-status { font-size: 0.85rem; color: var(--color-text-muted); }
  .council-sidebar__heading {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-text-muted);
    margin: var(--space-5) 0 var(--space-2);
  }
  details { border-bottom: 1px solid var(--color-border-subtle); padding: var(--space-2) 0; }
  summary { cursor: pointer; font-weight: 600; padding: var(--space-1) 0; color: var(--color-text); }
  details ul, #council-search-results { list-style: none; margin: var(--space-2) 0 var(--space-2) 0; padding: 0; }
  details ul { margin-left: var(--space-4); }
  details li, #council-search-results li { padding: var(--space-1) 0; }
  details a, #council-search-results a { color: var(--color-text); text-decoration: none; }
  details a:hover, #council-search-results a:hover { color: #ffffff; text-decoration: none; }
  details a[aria-current="page"] { font-weight: 600; color: var(--color-text); }

  /* Leaflet ships its own light-mode chrome for the zoom control — the
     basemap tiles stay as-is (it's imagery, not themeable), but the
     control buttons should match the rest of the UI. */
  .leaflet-bar, .leaflet-bar a {
    background: var(--color-surface) !important;
    border-color: var(--color-border-subtle) !important;
    color: var(--color-text) !important;
  }
  .leaflet-bar a:hover { background: var(--color-surface-hover) !important; }
</style>
{% endblock %}

{% block content %}
<div class="layout">
  <aside>
    {% include "councils/_council_sidebar.html" %}
  </aside>
  <main class="main-panel">
    <div id="council-switch-announcer" class="visually-hidden" aria-live="polite" role="status"></div>
    <div
      id="map"
      data-geojson-url="{% if geojson_static_path %}{% static geojson_static_path %}{% endif %}"
      data-manifest-url="{% static 'councils/geo/manifest.json' %}"
      data-nations-url="{% static 'councils/geo/nations.geojson' %}"
      data-coverage-url="{{ coverage_url|default:'' }}"
      data-selected-slug="{% if council %}{{ council.slug }}{% endif %}"
    ></div>
  </main>
</div>
<script src="{% static 'core/vendor/leaflet/leaflet.js' %}" defer></script>
<script src="{% static 'councils/js/map.js' %}" defer></script>
<script src="{% static 'councils/js/council-switch.js' %}" defer></script>
{% endblock %}
