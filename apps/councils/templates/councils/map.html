{% extends "core/base.html" %}
{% load static %}

{% block title %}{{ council.name }} — Local Spend Tracker{% endblock %}

{% block extra_head %}
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>
<style>
  html, body { margin: 0; height: 100%; }
  #map { height: 100vh; width: 100%; }
  #status {
    position: absolute;
    top: 1rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: white;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    font-family: system-ui, sans-serif;
    font-size: 0.9rem;
  }
</style>
{% endblock %}

{% block content %}
<div id="status">click the map</div>
<div id="map" data-geojson-url="{% static 'councils/geo/haringey.geojson' %}"></div>
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>
<script src="{% static 'councils/js/map.js' %}"></script>
{% endblock %}
