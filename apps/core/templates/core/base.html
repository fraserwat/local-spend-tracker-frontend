{% load static %}<!DOCTYPE html>
<html lang="en-gb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Local Spend Tracker{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'core/css/theme.css' %}">
  {% block extra_head %}{% endblock %}
  <style>
    #mobile-gate { display: none; }

    /* This app packs a map plus dense data panels — that layout has no
       useful mobile rendering, so screens narrower than a landscape
       tablet get a plain message instead of a squeezed, broken UI. */
    @media (max-width: 768px) {
      #app { display: none; }

      #mobile-gate {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 2rem;
        text-align: center;
        font-family: var(--font-sans);
        font-size: 1.1rem;
        line-height: 1.5;
        box-sizing: border-box;
        background: var(--color-bg);
        color: var(--color-text);
      }
    }
  </style>
</head>
<body>
  <div id="app">{% block content %}{% endblock %}</div>
  <div id="mobile-gate">Because of the data-centric approach of the Local Government Spend Checker, I have decided not to develop a mobile view. Sorry!</div>
</body>
</html>
