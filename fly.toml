# fly.toml app configuration file for local-spend-tracker-frontend
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'local-spend-tracker-frontend'
primary_region = 'lhr'
console_command = 'python manage.py shell'

[build]

[deploy]
  release_command = 'python manage.py migrate --noinput'

[env]
  DJANGO_SETTINGS_MODULE = 'config.settings.prod'

[http_service]
  internal_port = 8000
  force_https = true
  # Scale-to-zero doesn't mix with multi-minute streaming CSV exports --
  # measured live: a Croydon-scale export was cut short at 198,000 of
  # ~500,000 rows in just 40s, well under any worker timeout, matching
  # Fly's "excess capacity" autostop firing mid-response because it
  # doesn't count an open streaming connection as active traffic. The
  # architecture doc's own cost assumption was a small *always-on*
  # machine (unlike Neon, which is designed to scale to zero) -- this
  # keeps exactly one machine running at all times instead.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/healthz'
    # Fly's checker doesn't send a Host header matching the public domain
    # by default -- without this, Django's ALLOWED_HOSTS check 400s every
    # check and the machine never registers healthy.
    [http_service.checks.headers]
      Host = 'local-spend-tracker-frontend.fly.dev'

[[vm]]
  # Bumped from shared-cpu-1x/1gb for the England-wide reload_from_r2
  # backfill -- that job runs on this same machine (weekly-reload.yml SSHes
  # in), and 1 shared CPU was the likely bottleneck on the COPY/psycopg
  # side, not just Neon. Revisit scaling back down once the backfill's done
  # and only the steady-state weekly diff-reload remains.
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 4
