# fly.toml app configuration file for local-spend-tracker-frontend
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'local-spend-tracker-frontend'
primary_region = 'lhr'
console_command = 'python manage.py shell'

[build]

[deploy]
  release_command = 'python manage.py migrate --noinput'

[env]
  DJANGO_SETTINGS_MODULE = 'config.settings.prod'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
