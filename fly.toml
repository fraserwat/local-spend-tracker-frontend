# fly.toml app configuration file generated for local-spend-tracker-frontend on 2026-09-27T06:49:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'local-spend-tracker-frontend'
primary_region = 'lhr'
console_command = '/code/manage.py shell'

[build]

[deploy]
  release_command = 'python manage.py migrate --noinput'

[env]
  DJANGO_SETTINGS_MODULE = 'config.settings.prod'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

    [http_service.checks.headers]
      Host = 'local-spend-tracker-frontend.fly.dev'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
