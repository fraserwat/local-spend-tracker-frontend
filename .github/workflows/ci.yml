name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Catch newly disclosed CVEs against already-merged dependency pins --
    # pip-audit/bandit/gitleaks otherwise only run when a PR happens to
    # touch the repo. Matches docs/ARCHITECTURE.md's "periodic pip-audit".
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  DATABASE_URL: postgres://spend_tracker:spend_tracker@localhost:5432/spend_tracker

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy apps config manage.py

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: bandit (Python SAST)
        run: uv run bandit -r apps config -ll
      - name: pip-audit (dependency CVEs)
        run: uv run pip-audit
      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: check --deploy (prod settings)
        # Dummy values -- this only exercises settings validation
        # (HSTS, cookie flags, ALLOWED_HOSTS presence, etc.), never
        # touches a real deploy target.
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-check-deploy-placeholder-not-a-real-secret-0123456789
          DJANGO_ALLOWED_HOSTS: example.com
        run: uv run python manage.py check --deploy

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  test:
    name: Test (pytest + coverage + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: spend_tracker
          POSTGRES_USER: spend_tracker
          POSTGRES_PASSWORD: spend_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spend_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Run tests with coverage
        run: uv run pytest --cov=apps --cov-report=term-missing --cov-fail-under=80
