name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  DATABASE_URL: postgres://spend_tracker:spend_tracker@localhost:5432/spend_tracker

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy apps config manage.py

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: bandit (Python SAST)
        run: uv run bandit -r apps config -ll
      - name: pip-audit (dependency CVEs)
        # Non-blocking: Django 5.1.15 currently has known CVEs
        # (fix pending 5.2.x bump, tracked separately). Flip to
        # blocking once the pyproject.toml pin is bumped past it.
        run: uv run pip-audit
        continue-on-error: true
      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  test:
    name: Test (pytest + coverage + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: spend_tracker
          POSTGRES_USER: spend_tracker
          POSTGRES_PASSWORD: spend_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spend_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Run tests with coverage
        run: uv run pytest --cov=apps --cov-report=term-missing --cov-fail-under=80
