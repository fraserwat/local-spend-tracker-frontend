name: Weekly R2 reload

on:
  schedule:
    # Monday 04:00 UTC -- after nightly.yml's daily 03:00 UTC runs in the
    # sibling repo have had a full week to publish anything that changed.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  reload:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Reload changed councils from R2
        run: flyctl ssh console -a local-spend-tracker-frontend -C "python manage.py reload_from_r2"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
