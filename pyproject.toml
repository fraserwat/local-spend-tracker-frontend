[project]
name = "local-spend-tracker-frontend"
version = "0.1.0"
description = "Public map-driven browser for UK council spend-transparency data"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "psycopg[binary]>=3.2,<3.3",
    "django-environ>=0.11,<0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
