services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spend_tracker
      POSTGRES_USER: spend_tracker
      POSTGRES_PASSWORD: spend_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spend_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
